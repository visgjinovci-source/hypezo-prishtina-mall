<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>HyperActive Bus Stop</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 1 design px = 1 mm.  Big panels 2440×1840, side panel 1170×1600 */
:root{--orange:#EC5A2A;--deep:#4600BE;--rare:#321EFF;--smooth:#AF46FA;--mint:#3DF5C8;--ink:#12063A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:'League Spartan',sans-serif;color:#fff}
.panel{position:relative;overflow:hidden;margin:40px;background:var(--orange)}
.big{width:2440px;height:1840px}.side{width:1170px;height:1600px}
.abs{position:absolute}
/* tag shape borrowed from the HYPR tag logo */
.tagframe{position:absolute;clip-path:polygon(0 3%,100% 0,100% 100%,0 97%);background-size:cover;background-position:center}
.label{position:absolute;background:var(--deep);color:#fff;font-weight:900;text-transform:uppercase;line-height:1;padding:26px 44px 14px;clip-path:polygon(0 6%,100% 0,100% 100%,0 94%)}
.bolt{position:absolute}
.qr{background:#fff;padding:34px;border-radius:24px}
.qr img{display:block;width:100%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="bolt" viewBox="0 0 100 200"><path d="M62 0 L8 118 L46 118 L28 200 L94 72 L54 72 L80 0 Z"/></symbol>
</defs></svg>

<!-- 01 MAIN (244×184) -->
<section class="panel big" id="p1">
  <svg class="bolt" style="right:-60px;top:520px;width:760px;height:1520px;fill:var(--deep)"><use href="#bolt"/></svg>
  <img class="abs" src="assets/headline-white.png" style="left:120px;top:120px;width:2200px" alt="KTU PRITET AUTOBUSI PËR HYPERACTIVE!">
  <div class="tagframe" style="left:120px;top:690px;width:1640px;height:1030px;background-image:url(assets/kart-rider.jpg);background-position:35% 50%;transform:rotate(-2.5deg)"></div>
  <img class="abs" src="assets/logo-white.png" style="right:120px;bottom:120px;width:560px" alt="HyperActive">
</section>

<!-- 02 ARCADE MIRROR (244×184) -->
<section class="panel big" id="p2" style="background:var(--deep)">
  <svg class="bolt" style="left:-120px;top:-80px;width:600px;height:1200px;fill:var(--rare)"><use href="#bolt"/></svg>
  <svg class="bolt" style="right:-140px;top:700px;width:600px;height:1200px;fill:var(--rare)"><use href="#bolt"/></svg>
  <div class="abs" style="left:420px;right:420px;top:70px;bottom:0;background:var(--orange);border-radius:70px 70px 0 0"></div>
  <img class="abs" src="assets/logo-white.png" style="left:50%;top:130px;width:620px;transform:translateX(-50%)" alt="HyperActive">
  <div class="abs" style="left:520px;right:520px;top:330px;height:1080px;background:var(--ink);border-radius:60px;padding:46px">
    <div style="position:relative;width:100%;height:100%;border-radius:110px/80px;overflow:hidden;
      background:linear-gradient(135deg,#e3e9ef 0%,#9ea9b6 30%,#f6f8fa 46%,#a9b4c0 62%,#e9eef2 82%,#bcc5cf 100%)">
      <div class="abs" style="left:50%;top:70px;transform:translateX(-50%);background:var(--mint);color:var(--ink);font-family:'Press Start 2P';font-size:44px;padding:20px 28px;white-space:nowrap">PLAYER 1</div>
      <div class="abs" style="right:40px;bottom:30px;font-size:24px;font-weight:700;letter-spacing:.1em;color:rgba(18,6,58,.35)">PASQYRË / MIRROR</div>
    </div>
  </div>
  <div class="abs" style="left:0;right:0;top:1460px;text-align:center;font-size:124px;font-weight:900;line-height:1">TI JE LOJTARI I RADHËS!</div>
  <div class="abs" style="left:0;right:0;top:1640px;display:flex;justify-content:center;gap:70px">
    <i style="width:130px;height:130px;border-radius:50%;background:var(--deep)"></i>
    <i style="width:130px;height:130px;border-radius:50%;background:var(--mint)"></i>
    <i style="width:130px;height:130px;border-radius:50%;background:var(--rare)"></i>
    <i style="width:130px;height:130px;border-radius:50%;background:#fff"></i>
  </div>
</section>

<!-- 03 ACTIVITIES + QR (244×184) -->
<section class="panel big" id="p3">
  <div class="tagframe" style="left:110px;top:200px;width:560px;height:1180px;background-image:url(assets/kart-tunnel.jpg);transform:rotate(-3deg)"></div>
  <div class="label" style="left:150px;top:1300px;font-size:96px;transform:rotate(-3deg)">Karting</div>
  <div class="tagframe" style="left:730px;top:120px;width:560px;height:1180px;background-image:url(assets/arcade.jpg);background-position:42% 50%;transform:rotate(2deg)"></div>
  <div class="label" style="left:780px;top:1220px;font-size:96px;transform:rotate(2deg)">Arcade</div>
  <div class="tagframe" style="left:1350px;top:220px;width:560px;height:1180px;background-image:url(assets/gellyball.jpg);background-position:50% 35%;transform:rotate(-2deg)"></div>
  <div class="label" style="left:1380px;top:1320px;font-size:96px;transform:rotate(-2deg)">Gellyball</div>
  <div class="abs" style="left:1990px;top:640px;width:340px">
    <div class="qr"><img src="assets/qr.svg" alt="QR"></div>
    <div style="margin-top:40px;font-size:66px;font-weight:900;line-height:.95;text-align:center">SKANO<br>&amp; LUAJ</div>
    <div style="margin-top:22px;font-size:36px;font-weight:800;text-align:center">hyper-active.com</div>
  </div>
</section>

<!-- SIDE (117×160) -->
<section class="panel side" id="p4">
  <img class="abs" src="assets/logo-white.png" style="left:90px;top:100px;width:990px" alt="HyperActive">
  <div class="tagframe" style="left:90px;top:400px;width:990px;height:780px;background-image:url(assets/gellyball.jpg);background-position:50% 30%;transform:rotate(-2deg)"></div>
  <div class="abs qr" style="left:90px;bottom:90px;width:250px;padding:22px"><img src="assets/qr.svg" alt="QR"></div>
  <div class="abs" style="left:390px;bottom:110px;font-size:64px;font-weight:900;line-height:.95">SKANO<br>&amp; LUAJ</div>
  <svg class="bolt" style="right:70px;bottom:70px;width:150px;height:300px;fill:var(--deep)"><use href="#bolt"/></svg>
</section>
</body>
</html>
