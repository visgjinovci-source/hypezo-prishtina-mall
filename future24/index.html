<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future 24 Label OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: white sidebar and white cards on an almost-white page; black for actions, dark pink only where attention is needed */
  --bg:#F7F6F6;
  --surface:#FFFFFF;
  --ink:#111111;
  --muted:#6B6670;
  --line:#ECE9EC;
  --soft:#F4F2F3;
  --pink:#C8175D;
  --pink-soft:#FCE8F0;
  --pink-ink:#9E1048;
  --font-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(17,17,17,.04),0 10px 28px rgba(17,17,17,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:3px solid rgba(200,23,93,.45);outline-offset:2px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(700px 420px at 100% -10%,rgba(200,23,93,.07),transparent 70%)}
.app{position:relative;z-index:1;display:flex;min-height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type */
.display-xl{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,4vw,48px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.display-l{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,2.4vw,30px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.display-m{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.01em;margin:0}
.display-xl em,.display-l em{font-style:normal;color:var(--pink)}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* sidebar */
.sidebar{width:264px;flex:none;position:sticky;top:0;align-self:flex-start;height:100dvh;padding:14px}
.side-in{height:100%;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 14px 16px;display:flex;flex-direction:column;gap:24px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:40px;height:40px;flex:none;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:-.04em;position:relative}
.logo::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.brand b{display:block;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.01em;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--ink);color:#fff}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--pink-soft);color:var(--pink-ink);border-radius:999px;padding:2px 8px}
.nav button.on .badge{background:var(--pink);color:#fff}
.side-label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 14px;margin:0 0 4px}
.proj-link{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:0;background:transparent;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;width:100%;text-align:left}
.proj-link:hover{background:var(--soft)}
.proj-link.on{background:var(--soft)}
.pico{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.link-btn{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:9px 14px;text-align:left;cursor:pointer;border-radius:12px;display:flex;align-items:center;gap:10px}
.link-btn:hover{background:var(--soft);color:var(--ink)}

/* main + top */
main{flex:1;min-width:0;padding:18px 26px 120px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;min-height:52px}
.top-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.crumb button{border:0;background:none;padding:0;color:var(--muted);font-weight:600;cursor:pointer}
.crumb button:hover{color:var(--ink)}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:44px;width:260px;max-width:100%;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px;color:var(--ink)}
.mtop{display:none}
.icon-btn{position:relative;width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:#D8D4D9}
.icon-btn .pip{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid #fff}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;border:0;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#2A2A2A}
.btn-pink{background:var(--pink);color:#fff}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-line:hover{border-color:#D8D4D9}
.btn-sm{height:36px;padding:0 13px;font-size:13px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .cnt{font-size:11px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"] .cnt{color:#C9C5CB}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg button{height:34px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;padding:0 12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.text-link{border:0;background:transparent;color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;padding:6px 2px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.text-link:hover{color:var(--pink)}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* avatars */
.avs{display:inline-flex;padding-left:7px;vertical-align:middle}
.av{width:var(--s,28px);height:var(--s,28px);border-radius:50%;display:inline-grid;place-items:center;font-size:calc(var(--s,28px)*.36);font-weight:800;border:2px solid #fff;background:var(--c);color:var(--fg,#111);margin-left:-7px;flex:none;letter-spacing:.02em}

/* account banner */
.account{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;padding:26px;position:relative;overflow:hidden}
.account::before{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(200,23,93,.10),rgba(200,23,93,0) 65%);pointer-events:none}
.acc-left{display:flex;align-items:center;gap:20px;min-width:0;position:relative}
.acc-av{position:relative;width:84px;height:84px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-.02em;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--pink)}
.acc-av i{position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:#2EBD6B;border:3px solid #fff}
.acc-text{display:flex;flex-direction:column;gap:8px;min-width:0}
.acc-text p.sub{margin:0;color:var(--muted);font-size:14px;max-width:56ch}
.acc-text p.sub b{color:var(--ink)}
.acc-right{display:flex;flex-direction:column;gap:12px;position:relative}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;color:var(--ink)}
.stat:hover{border-color:#D8D4D9}
.stat b{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;color:var(--muted)}
.stat.alert{background:var(--pink-soft);border-color:#F6C9DA}
.stat.alert b{color:var(--pink)}
.stat.alert span{color:var(--pink-ink)}
.viewas{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.viewas select{height:36px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 10px;font-weight:700;font-size:13px;color:var(--ink)}

/* home */
.home-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:20px;align-items:start}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tcheck{width:24px;height:24px;border-radius:8px;border:2px solid #CFCBD1;background:#fff;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0}
.tcheck:hover{border-color:var(--ink)}
.tcheck.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tmain{border:0;background:none;text-align:left;padding:2px 0;cursor:pointer;min-width:0;color:var(--ink)}
.tmain b{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;line-height:1.35}
.tmain span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .tmain b{color:var(--muted);text-decoration:line-through}
.tright{display:flex;align-items:center;gap:8px}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.datebox{width:48px;height:48px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.datebox span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.datebox b{font-family:var(--font-display);font-size:19px;font-weight:800}
.datebox.today{background:var(--ink);color:#fff}
.datebox.today span{color:#C9C5CB}
.mrow b.t{display:block;font-size:14px}
.mrow span.s{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.brief-mini{display:flex;flex-direction:column;gap:10px}
.brief-mini p{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.spark{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--pink-ink);background:var(--pink-soft);border-radius:999px;padding:4px 10px}
.wl{display:grid;grid-template-columns:30px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:7px 0}
.wl .av{margin-left:0;border:0}
.wl-name{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.wl-bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:5px}
.wl-bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.wl-late{font-size:12px;font-weight:800;color:var(--pink);text-align:right}

/* week grid */
.week-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;min-width:900px}
.wcol{background:var(--soft);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.wcol.today{background:#fff;border:1.5px solid var(--ink)}
.whead{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 6px}
.whead span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.whead b{font-family:var(--font-display);font-size:20px;font-weight:800}
.wcol.today .whead b{color:var(--pink)}
.witem{display:flex;gap:7px;align-items:flex-start;text-align:left;border:0;text-decoration:none;background:#fff;border-radius:11px;padding:7px 8px;font-size:12px;font-weight:700;line-height:1.3;cursor:pointer;color:var(--ink);width:100%;box-shadow:0 1px 2px rgba(17,17,17,.05)}
.witem svg{flex:none;margin-top:1px}
.witem small{display:block;font-weight:600;color:var(--muted)}
.witem.late{background:var(--pink-soft);color:var(--pink-ink)}
.witem.key{background:var(--ink);color:#fff}
.witem.key small{color:#C9C5CB}
.wempty{font-size:12px;color:#A8A3AB;font-weight:600;padding:4px}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{border:1px solid var(--line);background:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:#D8D4D9}
.ptop{display:flex;align-items:center;gap:12px}
.ptop .pico{width:44px;height:44px;border-radius:14px}
.ptop b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.ptop span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.pbar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.subs-mini{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:10px}
.subs-mini div{display:grid;grid-template-columns:minmax(0,1fr) 56px 34px;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.subs-mini div span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:5px;border-radius:999px;background:var(--soft);overflow:hidden}
.mini i{display:block;height:100%;background:var(--ink)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.late-txt{color:var(--pink)}

.plist{display:flex;flex-direction:column;gap:16px}
.pl-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pl-head .ptop{min-width:240px}
.pl-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:700}
.pl-meta .pbar{width:140px}
.subtable{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.subtable th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.subtable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.subtable tr:last-child td{border-bottom:0}
.subtable .mini{width:110px;height:6px}
.subname{border:0;background:none;padding:0;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
.subname:hover{color:var(--pink)}
.tbl-wrap{overflow-x:auto}
.health{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--ink);white-space:nowrap}
.health::before{content:"";width:7px;height:7px;border-radius:50%;background:#9F9AA3}
.health.risk{background:var(--pink-soft);color:var(--pink-ink)}
.health.risk::before{background:var(--pink)}
.health.done{background:var(--ink);color:#fff}
.health.done::before{background:#fff}

.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.phead-l{display:flex;gap:18px;align-items:center;min-width:0}
.phead-l .pico{width:64px;height:64px;border-radius:20px}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.pmeta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:13px}
.pmeta div{display:flex;flex-direction:column;gap:3px}
.pmeta span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pmeta b{display:flex;align-items:center;gap:8px}
.ring{position:relative;width:86px;height:86px;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;font-weight:800}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--soft) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 8px))}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subcard{border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:var(--ink)}
.subcard:hover{border-color:#D8D4D9}
.subcard[aria-pressed="true"]{border:1.5px solid var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.06)}
.subcard b{font-size:15px;font-weight:800}
.subcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.addcard{border:1.5px dashed #D3CED5;background:transparent;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;min-height:120px}
.addcard:hover{color:var(--ink);border-color:var(--ink)}

/* board */
.board-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tool-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 10px;font-weight:600;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.board-wrap{overflow-x:auto;padding:2px 2px 14px;margin:0 -2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(264px,1fr));gap:14px;align-items:start}
.kcol{background:var(--soft);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.khead{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.khead h3{margin:0;font-size:14px;font-weight:800}
.count{font-size:12px;font-weight:800;background:#fff;border-radius:999px;padding:1px 8px;color:var(--muted)}
.khead .late-n{font-size:11.5px;font-weight:800;color:var(--pink)}
.khead .icon-btn{width:32px;height:32px;border-radius:10px;margin-left:auto}
.sdot{width:10px;height:10px;border-radius:50%;flex:none}
.s-todo{border:2px solid #A9A4AC;background:transparent}
.s-doing{background:conic-gradient(var(--ink) 50%,#fff 0);border:2px solid var(--ink)}
.s-review{background:var(--pink)}
.s-done{background:var(--ink)}
.kcol-body{display:flex;flex-direction:column;gap:8px;min-height:90px;border-radius:16px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:2px}
.kcol-body.over{background:rgba(200,23,93,.05);outline-color:rgba(200,23,93,.35)}
.kcard{border:1px solid var(--line);text-align:left;width:100%;background:#fff;border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(17,17,17,.05);cursor:grab;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s,transform .15s}
.kcard:hover{box-shadow:0 8px 20px rgba(17,17,17,.09);transform:translateY(-1px)}
.kcard.hidden{display:none}
.kc-crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-title{font-weight:700;font-size:14px;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
.kc-title svg{color:var(--pink);flex:none;margin-top:2px}
.is-done .kc-title{color:var(--muted);text-decoration:line-through}
.bar{height:5px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.appr{font-size:11.5px;font-weight:800;color:var(--pink-ink);background:var(--pink-soft);border-radius:10px;padding:5px 9px;align-self:flex-start}
.kc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kc-meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);font-weight:700}
.kc-meta span{display:inline-flex;align-items:center;gap:3px}
.due{height:22px;padding:0 8px;border-radius:8px;background:var(--soft);display:inline-flex;align-items:center;font-weight:800;color:var(--ink);font-size:11.5px;white-space:nowrap}
.due.today{background:var(--ink);color:#fff}
.due.late{background:var(--pink-soft);color:var(--pink-ink)}
.kph{border:2px dashed rgba(200,23,93,.45);border-radius:16px;background:rgba(200,23,93,.04)}
.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;transform:rotate(2deg) scale(1.03);box-shadow:0 22px 40px rgba(17,17,17,.22)!important}
.qadd input{width:100%;height:40px;border-radius:12px;border:1.5px dashed #D3CED5;background:transparent;padding:0 12px;font-size:13.5px;font-weight:600;outline:0}
.qadd input:focus{border-style:solid;border-color:var(--ink);background:#fff}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:8px 12px;align-items:start}
.lane-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;font-weight:800;position:sticky;top:0}
.lane-title{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 4px 4px;border-top:1px solid var(--line);margin-top:6px;flex-wrap:wrap}
.lane-title:first-of-type{border-top:0}
.lane-title b{font-size:15px;font-weight:800}
.lane-title .muted{font-size:12.5px;font-weight:600}
.lane-title .mini{width:90px;height:6px}
.lane-title .icon-btn{width:32px;height:32px;border-radius:10px;margin-left:auto}
.kcell{background:var(--soft);border-radius:16px;padding:8px;min-height:72px}
.filter-note{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 12px;border-radius:12px;background:var(--pink-soft);color:var(--pink-ink);font-size:13px;font-weight:700}
.filter-note button{width:28px;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.75);display:grid;place-items:center;cursor:pointer;color:var(--pink-ink)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keydates{display:flex;flex-direction:column}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* brief */
.brief-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:20px;align-items:start}
.brief-hero{display:flex;flex-direction:column;gap:14px;padding:26px;position:relative;overflow:hidden}
.brief-hero h2{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,2.8vw,34px);line-height:1.12;letter-spacing:-.02em;margin:0;max-width:30ch;text-wrap:balance}
.deliver{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.toggle .sw{width:32px;height:20px;border-radius:999px;background:#D6D2D8;position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--pink)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.updates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.update{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.update .tagline{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.update h3{font-family:var(--font-display);font-size:18px;font-weight:800;line-height:1.2;margin:0;letter-spacing:-.01em}
.update p{margin:0;font-size:14px;color:var(--muted)}
.update .src{font-size:12px;color:var(--muted);font-weight:600}
.update .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list-plain li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:14px}
.list-plain li:last-child{border-bottom:0}

/* team */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.person{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.person-top{display:flex;gap:12px;align-items:center}
.person-top .av{margin-left:0;border:0}
.person h3{margin:0;font-size:15px;font-weight:800}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstats div{background:var(--soft);border-radius:12px;padding:8px 10px}
.pstats b{display:block;font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1.1}
.pstats span{font-size:11.5px;font-weight:700;color:var(--muted)}
.pstats .alert{background:var(--pink-soft)}
.pstats .alert b{color:var(--pink)}
.person .acts{display:flex;gap:8px;flex-wrap:wrap}

/* files */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.fcard-h{display:flex;align-items:center;gap:12px}
.ficon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--soft);flex:none}
.fcard-h b{display:block;font-size:15px;font-weight:800}
.fcard-h span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.subfolders{display:flex;flex-wrap:wrap;gap:6px}
.subfolders a{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:10px;background:var(--soft);font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink)}
.files-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:20px;align-items:start;margin-top:20px}
.file-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.file-row:last-child{border-bottom:0}
.file-row .ficon{width:40px;height:40px;border-radius:12px}
.fname{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 20px;border-radius:22px;border:2px dashed #D3CED5;background:#fff;cursor:pointer}
.drop.over{border-color:var(--pink);background:var(--pink-soft)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}

/* how it works */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.flow-step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px}
.flow-step .n{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.flow-step:nth-child(3) .n{background:var(--pink)}
.flow-step b{font-size:15px}
.flow-step p{margin:0;font-size:13px;color:var(--muted)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.tbl b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.tbl p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.fields{display:flex;flex-wrap:wrap;gap:6px}
.fields span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--soft);border-radius:7px;padding:3px 7px}
.fields span.k{background:var(--pink-soft);color:var(--pink-ink)}
.auto-row{display:grid;grid-template-columns:minmax(150px,.8fr) 24px minmax(0,2fr);gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.auto-row:last-child{border-bottom:0}
.auto-row b{font-weight:800}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.idea{border-radius:20px;padding:18px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.idea b{font-family:var(--font-display);font-size:17px;font-weight:800;line-height:1.2}
.idea p{margin:0;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
section > h2.display-m{margin-bottom:12px}

/* sheet + modal */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50}
.sheet{position:fixed;z-index:51;top:12px;right:12px;bottom:12px;width:min(520px,calc(100% - 24px));background:#fff;border-radius:28px;box-shadow:0 30px 60px rgba(17,17,17,.22);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 0 24px}
.sheet-body{overflow:auto;padding:10px 24px 24px;display:flex;flex-direction:column;gap:18px;flex:1}
.sheet-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fff}
.sheet h2{font-family:var(--font-display);font-size:27px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--soft);border-radius:14px;padding:4px;gap:3px}
.seg4 button{height:36px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg4 button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,17,17,.12)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.meta div{background:var(--soft);border-radius:14px;padding:11px 13px;min-width:0}
.meta span{font-size:11.5px;color:var(--muted);font-weight:700}
.meta b{display:block;font-size:14px;margin-top:2px}
.sub-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.check{display:flex;gap:12px;align-items:center;min-height:40px;font-size:14px;cursor:pointer}
.check input{width:19px;height:19px;accent-color:var(--ink);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.approve-box{background:var(--pink-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.approve-box p{margin:0;font-size:14px;color:var(--pink-ink);font-weight:700}
.approved{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.filechip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.cms{display:flex;flex-direction:column;gap:12px}
.cm{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.cm .av{margin-left:0}
.cm-b{background:var(--soft);border-radius:14px;padding:9px 12px}
.cm-b.sys{background:var(--pink-soft)}
.cm-h{font-size:13px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.cm-h small{color:var(--muted);font-weight:600}
.cm-b p{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 30px 60px rgba(17,17,17,.22);display:flex;flex-direction:column;gap:18px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .l{font-size:13px;font-weight:800}
.input{height:48px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font-size:15px;font-weight:500;background:#FCFBFC;color:var(--ink);width:100%;outline:0}
.input:focus{border-color:var(--ink);background:#fff}
textarea.input{height:auto;min-height:80px;padding:12px 14px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 9px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.pick .av{margin-left:0;border:0;--s:24px}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pick[aria-pressed="true"] .pico{background:#2A2A2A;color:#fff}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--soft);cursor:pointer;border:0;width:100%;text-align:left}
.switch-row b{display:block;font-size:14px}
.switch-row small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sw2{width:44px;height:26px;border-radius:999px;background:#D6D2D8;position:relative;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch-row[aria-checked="true"] .sw2{background:var(--pink)}
.switch-row[aria-checked="true"] .sw2::after{transform:translateX(18px)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.done-box{background:var(--soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}

/* popover, toast */
.pop{position:absolute;right:0;top:54px;width:340px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 50px rgba(17,17,17,.16);padding:8px;z-index:45}
.pop button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:14px;cursor:pointer;color:var(--ink)}
.pop button:hover{background:var(--soft)}
.pop .ni{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft)}
.pop .ni.pk{background:var(--pink-soft);color:var(--pink)}
.pop b{display:block;font-size:13px}
.pop small{display:block;font-size:12px;color:var(--muted)}
.rel{position:relative}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:14px;padding:9px 9px 9px 18px;display:flex;gap:12px;align-items:center;z-index:70;transition:opacity .2s,transform .2s;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 14px 30px rgba(17,17,17,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:#fff;color:var(--ink);border-radius:10px;height:32px;padding:0 12px;font-weight:800;cursor:pointer}
.toast .tx{padding-right:8px}

/* bottom nav */
.bnav{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(430px,calc(100% - 24px));height:70px;background:var(--ink);border-radius:999px;padding:7px;z-index:40;align-items:center;justify-content:space-between;box-shadow:0 16px 34px rgba(17,17,17,.3)}
.bnav button{height:56px;min-width:56px;border-radius:999px;border:0;background:transparent;color:#BDB8BF;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:800;font-size:13px;padding:0 4px}
.bnav button .bl{display:none}
.bnav button.on{background:#fff;color:var(--ink);padding:0 16px}
.bnav button.on .bl{display:inline}
.bnav .fab{background:var(--pink)!important;color:#fff!important;width:56px;min-width:56px;padding:0!important}


/* v4: minimal projects + board */
.plist2{display:flex;flex-direction:column}
.prj{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 8px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:var(--ink);width:100%;border-radius:0}
.prj:last-child{border-bottom:0}
.prj:hover{background:var(--soft);border-radius:14px}
.prj b{display:block;font-size:16px;font-weight:700}
.prj .m{display:block;font-size:13px;color:var(--muted);font-weight:600}
.prj .r{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700}
.ptl{border-radius:14px;display:grid;place-items:center;background:var(--t);color:var(--tf);flex:none;box-sizing:border-box}
.proj-link .ptl{border-radius:9px}
.phd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.phd-l{display:flex;align-items:center;gap:14px;min-width:0}
.phd-l b{font-size:15px}
.phd-l p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.phd-r{display:flex;align-items:center;gap:8px}
.invite{width:34px;height:34px;border-radius:50%;border:1.5px dashed #CFCBD1;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.invite:hover{border-color:var(--ink);color:var(--ink)}
.subchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 12px;scrollbar-width:none}
.subchips::-webkit-scrollbar{display:none}
.pop a{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-decoration:none;padding:10px;border-radius:14px;color:var(--ink)}
.pop a:hover{background:var(--soft)}
.board{grid-template-columns:repeat(4,minmax(260px,1fr));gap:18px}
.kcol{background:transparent;padding:0;gap:10px}
.khead{padding:2px 2px 4px}
.khead h3{font-size:16px;font-weight:700}
.kplus{margin-left:auto;width:32px;height:32px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.kplus:hover{background:#fff;color:var(--ink)}
.kcol-body{gap:10px;min-height:60px}
.kcard{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:16px;border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(17,17,17,.04)}
.kc-check{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;border:1.5px solid #B9B4BC;background:#fff;color:#B9B4BC;display:grid;place-items:center;cursor:pointer;padding:0}
.kc-check:hover{border-color:var(--ink);color:var(--ink)}
.is-done .kc-check{background:var(--ink);border-color:var(--ink);color:#fff}
.kc-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.kc-open{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:15px;line-height:1.35;color:var(--ink);cursor:inherit}
.kc-open::after{content:"";position:absolute;inset:0;border-radius:18px}
.is-done .kc-open{color:var(--muted);text-decoration:line-through}
.kc-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:-4px}
.kc-foot{display:flex;align-items:center;gap:10px}
.kc-foot .avs{padding-left:7px}
.kc-due{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.kc-due.today{color:var(--ink);font-weight:800}
.kc-due.late{color:var(--pink);font-weight:800}
.kc-flag{color:var(--pink);display:inline-flex;margin-left:auto}
.qadd input{background:#fff;border:1px solid var(--line);border-style:solid;height:44px;border-radius:14px;color:var(--ink)}
.qadd input::placeholder{color:var(--muted);font-weight:700}
.trow{grid-template-columns:28px minmax(0,1fr) auto}

.brand .logo{display:grid;font-size:13px;color:#fff;font-weight:800;line-height:1}


/* v5: chat, inbox, editable structure */
.badge.count{background:var(--pink);color:#fff}
.nav button.on .badge.count{background:#fff;color:var(--pink)}
.bnav button{position:relative}
.bnav .pip{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.cat-head{display:flex;align-items:center;gap:8px;padding:8px 8px 2px}
.cat-name{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.add-row{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:12px 8px;cursor:pointer;border-radius:12px;width:100%;text-align:left}
.add-row:hover{background:var(--soft);color:var(--ink)}
.pop-sep{height:1px;background:var(--line);margin:6px 8px}
.tabrow{margin-bottom:14px}
.subrow{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.subrow .subchips{margin-bottom:0;flex:1;min-width:0}
.chip.dashed{border-style:dashed;padding:0 11px}
.mention{color:var(--pink-ink);background:var(--pink-soft);font-weight:700;border-radius:6px;padding:0 4px}
.chat{padding:0;display:flex;flex-direction:column}
.chat-list{display:flex;flex-direction:column;gap:16px;max-height:58vh;min-height:280px;overflow:auto;padding:22px 22px 12px}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;max-width:720px}
.msg .av{margin-left:0;border:0}
.msg-b{background:var(--soft);border-radius:4px 18px 18px 18px;padding:10px 14px;justify-self:start}
.msg.me .msg-b{background:#fff;border:1px solid var(--line)}
.msg-h{display:flex;gap:8px;align-items:baseline;font-size:13px}
.msg-h small{color:var(--muted);font-weight:600}
.msg-b p{margin:3px 0 0;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{position:relative;display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding:14px 16px}
.composer textarea{flex:1;min-height:48px;height:48px;resize:none;padding:13px 14px}
.composer .btn{width:48px;height:48px;padding:0;flex:none}
.mention-pop{position:absolute;left:12px;bottom:calc(100% + 6px);width:290px;max-width:calc(100% - 24px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(17,17,17,.16);padding:6px;z-index:60}
.mention-pop[hidden]{display:none}
.mention-pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;text-align:left;color:var(--ink)}
.mention-pop button:hover,.mention-pop button:first-child{background:var(--soft)}
.mention-pop b{display:block;font-size:13px}
.mention-pop small{display:block;font-size:12px;color:var(--muted)}
.comment-form .mention-pop{left:0}
.ibx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 8px;cursor:pointer;color:var(--ink)}
.ibx:last-child{border-bottom:0}
.ibx:hover{background:var(--soft);border-radius:14px}
.ibx b{display:block;font-size:14.5px;font-weight:800}
.ibx:not(.unread) b{font-weight:600}
.ib-txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;margin-top:2px}
.ibx:not(.unread) .ib-txt{color:var(--muted)}
.ib-ctx{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
.ibx .when{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.udot{width:9px;height:9px;border-radius:50%;background:var(--pink);flex:none}

.role-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:2px 0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.role-btn svg{opacity:.55}
.role-btn:hover{color:var(--ink)}
.role-btn.tbd{color:var(--pink-ink);font-weight:600}

/* responsive */
@media (max-width:1240px){.home-row,.brief-grid,.files-row{grid-template-columns:minmax(0,1fr)}.account{grid-template-columns:minmax(0,1fr)}.viewas{justify-content:flex-start}.flow{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
@media (max-width:1023px){
  .sidebar{display:none}
  main{padding:14px 16px 120px}
  .bnav{display:flex}
  .top{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .mtop .who{display:flex;align-items:center;gap:10px;min-width:0}
  .mtop .who b{display:block;font-size:15px}
  .mtop .who small{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .mtop .acts{display:flex;gap:8px}
  .mtop .icon-btn{width:40px;height:40px}
  .toast{bottom:100px}
  .phead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .board{grid-template-columns:repeat(4,84vw);gap:12px}
  .board-wrap{scroll-snap-type:x mandatory}
  .kcol{scroll-snap-align:start}
  .phd-r .avs,.phd-r .invite{display:none}
  .phd{flex-wrap:nowrap}
  .phd-l p{font-size:12px}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92%;border-radius:28px 28px 0 0}
  .modal{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:94%;border-radius:28px 28px 0 0}
  .updates,.two,.row2{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acc-left{flex-direction:column;align-items:flex-start;gap:16px}
  .acc-av{width:64px;height:64px;font-size:22px}
  .account{padding:20px}
  .auto-row{grid-template-columns:minmax(0,1fr)}
  .auto-row svg{display:none}
  .phead-l{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function shiftAll(s, n){
  s.tasks.forEach(function(t){ t.due = addDays(t.due, n); });
  s.subs.forEach(function(x){ if (x.due) x.due = addDays(x.due, n); });
  s.projects.forEach(function(p){ if (p.end) p.end = addDays(p.end, n); });
  s.events.forEach(function(e){ e.start = addDays(e.start, n); e.end = addDays(e.end, n); });
  s.comments.forEach(function(c){ c.at = addDays(c.at, n); });
  s.recents.forEach(function(r){ r.at = addDays(r.at, n); });
  (s.messages || []).forEach(function(m){ m.at = addDays(m.at, n); });
  (s.inbox || []).forEach(function(i){ i.at = addDays(i.at, n); });
  s.seedTs = TODAY;
}
function load(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.v !== 5) return null;
    const n = Math.round((TODAY - s.seedTs)/DAY);
    if (n) shiftAll(s, n);
    return s;
  } catch(e){ return null; }
}

function prof(id){ return S.profiles.find(function(p){ return p.id === id; }) || {name:'Label OS', first:'', initials:'OS', color:'#FCE8F0', fg:'#9E1048', role:''}; }
function proj(id){ return S.projects.find(function(p){ return p.id === id; }) || S.projects[0] || {id:'', name:'Project', icon:'layers', lead:'vg', category:null, end:TODAY}; }
function byHandle(h){ h = String(h).toLowerCase(); return S.profiles.find(function(p){ return p.handle === h; }); }
function richText(body){ return esc(body).replace(/@([a-z0-9]+)/gi, function(m, h){ const p = byHandle(h); return p ? '<span class="mention" title="'+esc(p.name)+'">@'+esc(p.first)+'</span>' : m; }); }
function mentionsIn(body){ const out = []; String(body).replace(/@([a-z0-9]+)/gi, function(m, h){ const p = byHandle(h); if (p && out.indexOf(p.id) < 0) out.push(p.id); return m; }); return out; }
function notify(to, kind, o){ if (to === S.me) return; S.inbox.push(Object.assign({id:uid(), to:to, kind:kind, from:S.me, project:null, task:null, text:'', at:Date.now(), read:false}, o)); }
function unread(){ return S.inbox.filter(function(i){ return i.to === S.me && !i.read; }).length; }
function sub(id){ return S.subs.find(function(s){ return s.id === id; }) || null; }
function subsOf(pid){ return S.subs.filter(function(s){ return s.project === pid; }); }
function task(id){ return S.tasks.find(function(t){ return t.id === id; }); }
function commentsOf(id){ return S.comments.filter(function(c){ return c.task === id; }).sort(function(a,b){ return a.at - b.at; }); }
function checkPct(t){ if (!t.checklist || !t.checklist.length) return null; return Math.round(t.checklist.filter(function(c){ return c.done; }).length / t.checklist.length * 100); }
function names(ids){ const n = ids.map(function(i){ return prof(i).name; }); return n.length > 1 ? n.slice(0,-1).join(', ') + ' and ' + n[n.length-1] : (n[0] || ''); }
function isLate(t){ return t.status !== 'done' && t.due < TODAY; }
function crumb(t){ const p = proj(t.project), s = sub(t.sub); return p.name + (s ? ' · ' + s.name : ''); }
function avatars(ids, s, max){
  max = max || 4; s = s || 28;
  let h = '<span class="avs">';
  ids.slice(0, max).forEach(function(id){ const p = prof(id); h += '<span class="av" title="'+esc(p.name)+'" style="--s:'+s+'px;--c:'+p.color+(p.fg?';--fg:'+p.fg:'')+'">'+esc(p.initials)+'</span>'; });
  if (ids.length > max) h += '<span class="av" style="--s:'+s+'px;--c:#F4F2F3">+'+(ids.length-max)+'</span>';
  return h + '</span>';
}
function av1(id, s){ const p = prof(id); return '<span class="av" style="margin-left:0;border:0;--s:'+(s||28)+'px;--c:'+p.color+(p.fg?';--fg:'+p.fg:'')+'">'+esc(p.initials)+'</span>'; }
const STATUS = [['todo','To do'],['doing','In progress'],['review','Needs approval'],['done','Done']];
function statusLabel(s){ const f = STATUS.find(function(x){ return x[0] === s; }); return f ? f[1] : s; }
function sdot(s){ return '<span class="sdot s-'+s+'" aria-hidden="true"></span>'; }
function ordered(status){ return S.tasks.filter(function(t){ return t.status === status; }).sort(function(a,b){ return a.position - b.position; }); }
function renumber(status){ ordered(status).forEach(function(t, i){ t.position = i; }); }
function statsOf(list){ const done = list.filter(function(t){ return t.status === 'done'; }).length; return {total:list.length, done:done, open:list.length - done, late:list.filter(isLate).length, pct:list.length ? Math.round(done/list.length*100) : 0}; }
function subStats(sid){ return statsOf(S.tasks.filter(function(t){ return t.sub === sid; })); }
function projStats(pid){ return statsOf(S.tasks.filter(function(t){ return t.project === pid; })); }
function health(due, st){
  if (st.total && st.done === st.total) return ['Done','done'];
  if (st.late > 0 || (due && due - TODAY <= 3*DAY && st.pct < 50 && st.open > 0)) return ['At risk','risk'];
  return ['On track','ok'];
}

function weekGrid(mon, mineOnly, type){
  let h = '<div class="week-wrap"><div class="weekgrid">';
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i), today = sameDay(d, TODAY);
    let ev = S.events.filter(function(e){ return sameDay(e.start, d) && (!mineOnly || e.people.indexOf(S.me) >= 0); });
    let ts = S.tasks.filter(function(t){ return t.status !== 'done' && sameDay(t.due, d) && (!mineOnly || t.assignees.indexOf(S.me) >= 0); });
    if (type === 'meetings'){ ev = ev.filter(function(e){ return e.type === 'meeting'; }); ts = []; }
    if (type === 'deadlines'){ ev = []; }
    if (type === 'key'){ ev = ev.filter(function(e){ return e.type === 'show' || e.type === 'release'; }); ts = []; }
    ev.sort(function(a,b){ return a.start - b.start; });
    let items = ev.map(function(e){
      const key = e.type === 'show' || e.type === 'release';
      const time = (e.end - e.start) >= 6*3600000 ? 'All day' : fmtTime(e.start);
      return '<a class="witem'+(key?' key':'')+'" href="'+(e.type==='meeting'?MEET:'#calendar')+'" '+(e.type==='meeting'?'target="_blank" rel="noopener"':'')+'>'+icon(EVT[e.type].icon,14)+'<span>'+esc(e.title)+'<small>'+time+'</small></span></a>';
    }).join('');
    items += ts.map(function(t){ return '<button type="button" class="witem'+(isLate(t)?' late':'')+'" data-action="open-task" data-id="'+t.id+'">'+icon('target',14)+'<span>'+esc(t.title)+'<small>'+esc(proj(t.project).name)+'</small></span></button>'; }).join('');
    h += '<div class="wcol'+(today?' today':'')+'"><div class="whead"><span>'+WD[i]+'</span><b>'+new Date(d).getDate()+'</b></div>'+(items || '<span class="wempty">Free</span>')+'</div>';
  }
  return h + '</div></div>';
}

function mentionQuery(el){ const v = el.value.slice(0, el.selectionStart); const m = v.match(/(^|\s)@([a-z0-9]*)$/i); return m ? m[2] : null; }
function updateMentionPop(el){
  const pop = document.getElementById('mp-' + el.id); if (!pop) return;
  const q = mentionQuery(el);
  if (q === null){ pop.hidden = true; pop.innerHTML = ''; return; }
  const ql = q.toLowerCase();
  const list = S.profiles.filter(function(p){ return p.handle.indexOf(ql) === 0 || p.name.toLowerCase().indexOf(ql) >= 0; }).slice(0,6);
  if (!list.length){ pop.hidden = true; pop.innerHTML = ''; return; }
  pop.innerHTML = list.map(function(p){ return '<button type="button" data-action="mention-pick" data-field="'+el.id+'" data-handle="'+p.handle+'">'+av1(p.id,26)+'<span><b>'+esc(p.name)+'</b><small>@'+p.handle+'</small></span></button>'; }).join('');
  pop.hidden = false;

function pickMention(fieldId, handle){
  const el = document.getElementById(fieldId); if (!el) return;
  const pos = el.selectionStart;
  const before = el.value.slice(0, pos).replace(/@([a-z0-9]*)$/i, '@' + handle + ' ');
  el.value = before + el.value.slice(pos);
  el.focus(); el.selectionStart = el.selectionEnd = before.length;
  updateMentionPop(el);
}
function doDelete(d){
  if (d.kind === 'category'){
    const left = S.categories.filter(function(c){ return c.id !== d.id; });
    const moving = S.projects.filter(function(p){ return p.category === d.id; });
    if (moving.length){ let other = left.find(function(c){ return c.name === 'Other'; }); if (!other){ other = {id:uid(), name:'Other'}; left.push(other); } moving.forEach(function(p){ p.category = other.id; }); }
    S.categories = left;
  } else if (d.kind === 'project'){
    const tids = S.tasks.filter(function(t){ return t.project === d.id; }).map(function(t){ return t.id; });
    S.tasks = S.tasks.filter(function(t){ return t.project !== d.id; });
    S.comments = S.comments.filter(function(c){ return tids.indexOf(c.task) < 0; });
    S.subs = S.subs.filter(function(x){ return x.project !== d.id; });
    S.messages = S.messages.filter(function(m){ return m.project !== d.id; });
    S.inbox = S.inbox.filter(function(i){ return i.project !== d.id; });
    S.projects = S.projects.filter(function(p){ return p.id !== d.id; });
    if (U.project === d.id) U.project = null;
  } else if (d.kind === 'sub'){
    S.tasks.forEach(function(t){ if (t.sub === d.id) t.sub = null; });
    S.subs = S.subs.filter(function(x){ return x.id !== d.id; });
    if (U.projSub === d.id) U.projSub = null;
  }
  U.modal = null; render(); toast('Deleted');
}

  if (a === 'approvals'){ const t = S.tasks.find(function(x){ return x.status === 'review' && (x.approvers||[]).indexOf(S.me) >= 0; }); if (t) openTask(t.id); else toast('Nothing waiting for you'); return; }
  if (a === 'clear-search'){ U.q = ''; render(); return; }
  if (a === 'toggle-done'){
    const t = task(id); if (!t) return;
    if (t.status === 'done'){ t.justDone = false; setStatus(t, 'todo', true); toast('Moved back to To do'); }
    else { t.justDone = true; setStatus(t, 'done', true); toast('Done. Nice work.', 'Undo', function(){ t.justDone = false; setStatus(t, 'todo', true); render(); }); }
    render(); return;
  }
  if (a === 'cal-prev'){ U.calWeek = addDays(U.calWeek,-7); render(); return; }
  if (a === 'cal-next'){ U.calWeek = addDays(U.calWeek,7); render(); return; }
  if (a === 'cal-today'){ U.calWeek = MON; render(); return; }
  if (a === 'cal-type'){ U.calType = el.dataset.t; render(); return; }
  if (a === 'brief-tab'){ U.briefTab = el.dataset.tab; render(); return; }
  if (a === 'brief-toggle'){ const k = el.dataset.key; S.brief.settings[k] = !S.brief.settings[k]; render(); return; }
  if (a === 'copy-brief'){ try { navigator.clipboard.writeText(briefText()).then(function(){ toast('Brief copied'); }, function(){ toast('Copy is blocked here. Use Send now in Gmail.'); }); } catch(err){ toast('Copy is blocked here. Use Send now in Gmail.'); } return; }
  if (a === 'make-task'){
    const u = S.brief.updates.find(function(x){ return x.id === id; });
    const t = addTask({title:u.title, description:u.body, project:'content', sub:'s8', status:'todo', assignees:['cc'], due:addDays(TODAY,3), priority:'normal'});
    u.task = t.id; render(); toast('Added to Content · TikTok', 'Open', function(){ openTask(t.id); }); return;
  }
  if (a === 'reset-demo'){ try { localStorage.removeItem(STORE); } catch(err){} S = seed(); U = defaultU(); go('home'); toast('Demo data reset'); return; }
  const t = U.openTask && task(U.openTask);
  if (t){
    if (a === 'set-status'){ setStatus(t, el.dataset.status); render(); return; }
    if (a === 'approve'){ t.assignees.forEach(function(x){ notify(x, 'status', {project:t.project, task:t.id, text:'Approved: ' + t.title}); }); t.approvedBy = S.me; setStatus(t, 'done', true); addComment(t.id, 'sys', 'Approved by ' + prof(S.me).name + '. The people assigned were notified.'); render(); toast('Approved and moved to Done'); return; }
    if (a === 'changes'){ setStatus(t, 'doing', true); addComment(t.id, 'sys', 'Changes requested by ' + prof(S.me).name + '. Moved back to In progress.'); render(); toast('Sent back with a change request'); return; }
    if (a === 'delete-task'){
      if (!U.confirmDelete){ U.confirmDelete = true; render(); return; }
      S.tasks = S.tasks.filter(function(x){ return x.id !== t.id; }); S.comments = S.comments.filter(function(c){ return c.task !== t.id; });
      U.openTask = null; U.confirmDelete = false; render(); toast('Task deleted'); return;
    }
  }
  const m = U.modal;
  if (m){
    if (a === 'pick-project'){ m.draft.project = id; const f = subsOf(id)[0]; m.draft.sub = f ? f.id : null; render(); return; }
    if (a === 'pick-subp'){ m.draft.sub = id; render(); return; }
    if (a === 'pick-cat'){ m.draft.category = id; render(); return; }
    if (a === 'pick-owner'){ if (m.type === 'project') m.draft.lead = id; else m.draft.owner = id; render(); return; }
    if (a === 'pick-person'){ const arr = m.type === 'task' ? m.draft.assignees : m.draft.people; const i = arr.indexOf(id); if (i >= 0) arr.splice(i,1); else arr.push(id); render(); return; }
    if (a === 'pick-priority'){ m.draft.priority = id; render(); return; }
    if (a === 'due-quick'){ m.draft.due = addDays(TODAY, +el.dataset.days); render(); return; }
    if (a === 'switch'){ const k = el.dataset.key; m.draft[k] = !m.draft[k]; render(); return; }
  }
});

document.addEventListener('input', function(e){
  const el = e.target;
  if (el.id === 'q'){ U.q = el.value; render(); return; }
  if (U.modal && el.dataset.bind){ U.modal.draft[el.dataset.bind] = el.value; }
  if (el.dataset && el.dataset.mentions) updateMentionPop(el);
});
document.addEventListener('change', function(e){
  const el = e.target;
  if (el.id === 'viewas'){ S.me = el.value; U.boardPerson = null; render(); toast('Now viewing as ' + prof(S.me).name); return; }
  if (el.id === 't-sub' && U.openTask){ const t = task(U.openTask); t.sub = el.value; render(); toast('Moved to ' + sub(el.value).name); return; }
  if (el.dataset.check !== undefined && U.openTask){ const t = task(U.openTask); t.checklist[+el.dataset.check].done = el.checked; render(); return; }
  if (el.id === 'btime'){ S.brief.settings.time = el.value; render(); toast('Brief arrives every day at ' + el.value); return; }
  if (U.modal){
    const d = U.modal.draft;
    if (el.id === 'f-due' && el.value) d.due = parseDate(el.value);
    if (el.id === 'f-status') d.status = el.value;
    if (el.id === 's-due' && el.value) d.due = parseDate(el.value);
    if (el.id === 'g-date' && el.value) d.day = parseDate(el.value);
    if (el.id === 'g-time') d.time = el.value;
    if (el.id === 'g-len') d.len = +el.value;
  }
  if (el.id === 'file-in' && el.files && el.files.length) addFiles(el.files);
});
document.addEventListener('submit', function(e){
  const f = e.target;
  e.preventDefault();
  if (f.classList.contains('qadd')){
    const inp = f.querySelector('input'), v = inp.value.trim();
    if (!v) return;
    const d = newTaskDraft({status:f.dataset.status});
    d.title = v; d.assignees = U.view === 'board' && U.boardPerson ? [U.boardPerson] : [S.me];
    const t = addTask(d); afterCreate(t);
    const fid = inp.id; render(); const again = document.getElementById(fid); if (again) again.focus();
    toast('Task added to ' + crumb(t), 'Open', function(){ openTask(t.id); }); return;
  }
  if (f.id === 'task-form'){
    const d = U.modal.draft;
    d.title = document.getElementById('f-title').value;
    if (!d.title.trim()){ document.getElementById('f-title').focus(); return; }
    const t = addTask(d); afterCreate(t);
    U.modal = null; render();
    toast('Added to ' + crumb(t) + (d.notify && d.assignees.length ? '. People get an email in the live app.' : ''), 'Open', function(){ openTask(t.id); });
    return;
  }
  if (f.id === 'project-form'){
    const d = U.modal.draft;
    d.name = document.getElementById('np-name').value.trim();
    if (!d.name){ document.getElementById('np-name').focus(); return; }
    const pr = {id:uid(), category:d.category || (S.categories[0] && S.categories[0].id), name:d.name, icon:'layers', lead:d.lead, end:addDays(TODAY,60), description:''};
    S.projects.push(pr);
    S.subs.push({id:uid(), project:pr.id, name:'General', owner:d.lead, due:addDays(TODAY,30)});
    U.modal = null; U.project = pr.id; U.projSub = null; go('projects'); toast('Project created'); return;
  }
  if (f.id === 'sub-form'){
    const d = U.modal.draft;
    d.name = document.getElementById('s-name').value.trim();
    if (!d.name){ document.getElementById('s-name').focus(); return; }
    const s = {id:uid(), project:d.project, name:d.name, owner:d.owner, due:d.due};
    S.subs.push(s);
    const back = U.modal.back;
    if (back){ back.draft.project = s.project; back.draft.sub = s.id; U.modal = back; } else U.modal = null;
    render(); toast('Sub-project added: ' + s.name + '. Drive folder created in the live app.'); return;
  }
  if (f.id === 'meet-form'){
    const d = U.modal.draft;
    d.title = document.getElementById('g-title').value.trim();
    if (!d.title){ document.getElementById('g-title').focus(); return; }
    const hm = (d.time || '11:00').split(':');
    const start = at(d.day, 0, +hm[0], +hm[1]);
    const ev = {id:uid(), type:'meeting', title:d.title, start:start, end:start + d.len*60000, people:d.people.slice()};
    S.events.push(ev); U.modal.done = ev; render(); return;
  }
  if (f.classList.contains('chat-form')){
    const ta = document.getElementById('chat-in'), v = ta.value.trim();
    if (!v) return;
    const pid = f.dataset.project;
    S.messages.push({id:uid(), project:pid, author:S.me, body:v, at:Date.now()});
    mentionsIn(v).forEach(function(x){ notify(x, 'mention', {project:pid, task:null, text:v}); });
    render(); const again = document.getElementById('chat-in'); if (again) again.focus();
    return;
  }
  if (f.id === 'rename-form'){
    const d = U.modal.draft, v = document.getElementById('r-name').value.trim(); if (!v) return;
    if (d.kind === 'role'){ prof(d.id).role = v; U.modal = null; render(); toast('Role saved'); return; }
    const obj = d.kind === 'category' ? S.categories.find(function(c){ return c.id === d.id; }) : d.kind === 'project' ? proj(d.id) : sub(d.id);
    obj.name = v; U.modal = null; render(); toast('Renamed'); return;
  }
  if (f.id === 'category-form'){
    const v = document.getElementById('cat-name').value.trim(); if (!v) return;
    S.categories.push({id:uid(), name:v}); U.modal = null; render(); toast('Category added'); return;
  }
  if (f.id === 'move-form'){
    const d = U.modal.draft; proj(d.id).category = d.category; U.modal = null; render();
    toast('Moved to ' + (S.categories.find(function(c){ return c.id === d.category; }) || {name:''}).name); return;
  }
  if (f.classList.contains('comment-form')){
    const ta = f.querySelector('textarea'), v = ta.value.trim();
    if (!v || !U.openTask) return;
    addComment(U.openTask, S.me, v);
    const tt = task(U.openTask), ment = mentionsIn(v);
    ment.forEach(function(x){ notify(x, 'mention', {project:tt.project, task:tt.id, text:v}); });
    tt.assignees.forEach(function(x){ if (ment.indexOf(x) < 0) notify(x, 'comment', {project:tt.project, task:tt.id, text:v}); });
    render();
    const again = document.getElementById('c-body'); if (again) again.focus();
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (U.openTask){ U.openTask = null; render(); }
    else if (U.modal){ U.modal = U.modal.back || null; render(); }
    else if (U.notif || U.more || U.q || U.catMenu || U.subMenu){ U.notif = false; U.more = false; U.catMenu = null; U.subMenu = false; U.q = ''; render(); }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && (e.target.id === 'c-body' || e.target.id === 'chat-in')){ e.preventDefault(); const mp = document.getElementById('mp-' + e.target.id); if (mp && !mp.hidden){ const first = mp.querySelector('button'); if (first){ pickMention(e.target.id, first.dataset.handle); return; } } const f = e.target.closest('form'); if (f){ if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true})); } }
});

function addFiles(list){
  Array.prototype.slice.call(list, 0, 10).forEach(function(file){
    const kind = /^image\//.test(file.type) ? 'image' : /^video\//.test(file.type) ? 'video' : 'file';
    S.recents.unshift({name:file.name, folder:'Inbox', by:S.me, at:Date.now(), kind:kind});
  });
  render(); toast('Added to Recent uploads. The live app sends them to Google Drive.');
}
document.addEventListener('dragover', function(e){ const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', function(e){ const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function(e){ const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); } });

/* ---------- drag and drop on the board (mouse, pen and touch) ---------- */
let drag = null, justDragged = false;
document.addEventListener('pointerdown', function(e){
  const card = e.target.closest('.kcard');
  if (!card || e.target.closest('.kc-check') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = {id:card.dataset.drag, card:card, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, started:false, touch:e.pointerType !== 'mouse', timer:null};
  if (drag.touch){ const d = drag; d.timer = setTimeout(function(){ if (drag === d && !d.started) startDrag(); }, 260); }
});
document.addEventListener('pointermove', function(e){
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
  if (!drag.started){
    if (drag.touch){ if (moved > 10){ clearTimeout(drag.timer); drag = null; } return; }
    if (moved < 6) return;
    startDrag();
  }
  moveDrag();
});
document.addEventListener('pointerup', function(){ if (!drag) return; clearTimeout(drag.timer); if (drag.started) endDrag(true); drag = null; });
document.addEventListener('pointercancel', function(){ if (!drag) return; clearTimeout(drag.timer); if (drag.started) endDrag(false); drag = null; });
document.addEventListener('touchmove', function(e){ if (drag && drag.started) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', function(e){ if (e.target.closest && e.target.closest('.kcard')) e.preventDefault(); });
function startDrag(){
  const r = drag.card.getBoundingClientRect();
  drag.started = true; drag.ox = drag.sx - r.left; drag.oy = drag.sy - r.top;
  const g = drag.card.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('data-action'); g.style.width = r.width + 'px'; g.style.left = (drag.x - drag.ox) + 'px'; g.style.top = (drag.y - drag.oy) + 'px';
  document.body.appendChild(g); drag.ghost = g;
  const ph = document.createElement('div'); ph.className = 'kph'; ph.style.height = r.height + 'px';
  drag.card.parentNode.insertBefore(ph, drag.card); drag.ph = ph;
  drag.card.classList.add('hidden');
  document.body.style.cursor = 'grabbing';
  if (navigator.vibrate){ try { navigator.vibrate(10); } catch(err){} }
}
function moveDrag(){
  drag.ghost.style.left = (drag.x - drag.ox) + 'px'; drag.ghost.style.top = (drag.y - drag.oy) + 'px';
  const el = document.elementFromPoint(drag.x, drag.y);
  const body = el && (el.closest('.kcol-body') || (el.closest('.kcol') && el.closest('.kcol').querySelector('.kcol-body')));
  document.querySelectorAll('.kcol-body.over').forEach(function(b){ if (b !== body) b.classList.remove('over'); });
  if (body){
    body.classList.add('over');
    const cards = Array.prototype.filter.call(body.querySelectorAll('.kcard'), function(c){ return c !== drag.card; });
    let before = null;
    for (let i = 0; i < cards.length; i++){ const r = cards[i].getBoundingClientRect(); if (drag.y < r.top + r.height/2){ before = cards[i]; break; } }
    if (before) body.insertBefore(drag.ph, before); else body.appendChild(drag.ph);
  }
  const bw = document.getElementById('board-wrap');
  if (bw){ const r = bw.getBoundingClientRect(); if (drag.x < r.left + 50) bw.scrollLeft -= 14; else if (drag.x > r.right - 50) bw.scrollLeft += 14; }
  if (drag.y < 70) window.scrollBy(0, -12); else if (drag.y > window.innerHeight - 110) window.scrollBy(0, 12);
}
function endDrag(commit){
  const d = drag;
  d.ghost.remove(); document.body.style.cursor = '';
  document.querySelectorAll('.kcol-body.over').forEach(function(b){ b.classList.remove('over'); });
  justDragged = true; setTimeout(function(){ justDragged = false; }, 60);
  if (!commit || !d.ph.parentNode){ if (d.ph.parentNode) d.ph.remove(); d.card.classList.remove('hidden'); return; }
  const body = d.ph.parentNode, status = body.dataset.status, lane = body.dataset.lane, laneType = body.dataset.lanetype;
  let next = d.ph.nextElementSibling; while (next && (next === d.card || !next.classList.contains('kcard'))) next = next.nextElementSibling;
  const t = task(d.id), from = t.status, fromSub = t.sub, fromProject = t.project;
  const list = ordered(status).filter(function(x){ return x.id !== t.id; });
  let idx = next ? list.findIndex(function(x){ return x.id === next.dataset.drag; }) : -1;
  if (idx < 0){
    if (lane){ let last = -1; list.forEach(function(x, i){ if ((laneType === 'sub' ? x.sub : x.project) === lane) last = i; }); idx = last + 1; if (last < 0) idx = list.length; }
    else idx = list.length;
  }
  list.splice(idx, 0, t);
  t.status = status;
  list.forEach(function(x, i){ x.position = i; });
  if (from !== status) renumber(from);
  if (from !== status && status === 'review' && t.needsApproval) (t.approvers || []).forEach(function(x){ notify(x, 'approval', {project:t.project, task:t.id, text:t.title}); });
  if (laneType === 'sub' && lane && t.sub !== lane){ t.sub = lane; t.project = sub(lane).project; }
  if (laneType === 'project' && lane && t.project !== lane){ t.project = lane; const f = subsOf(lane)[0]; t.sub = f ? f.id : null; }
  render();
  const msgs = [];
  if (from !== status) msgs.push(status === 'review' && t.needsApproval ? 'Sent for approval to ' + names(t.approvers || []) : status === 'done' ? 'Done. Nice work.' : 'Moved to ' + statusLabel(status));
  if (t.sub !== fromSub || t.project !== fromProject) msgs.push('Now in ' + crumb(t));
  if (msgs.length) toast(msgs.join(' · '));
}

/* ---------- start ---------- */
function start(data){
  S = (data && data.S && data.S.v === 5) ? data.S : (load() || seed());
  ensureAdmin(S);
  if (!(data && data.S && data.S.v === 5)) data = {};
  U = Object.assign(defaultU(), (data && data.U) || {});
  U.openTask = null; U.modal = null; U.notif = false;
  const h = location.hash.slice(1);
  if (VIEWS.indexOf(h) >= 0) U.view = h;
  if (VIEWS.indexOf(U.view) < 0) U.view = 'home';
  render();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {S:S, U:U}; }); } catch(err){}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
